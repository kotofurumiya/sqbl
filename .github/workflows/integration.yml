# E2E tests against real PostgreSQL/MariaDB, run via the integrations/
# submodule's own docker-compose setup. Runs directly on push to main/develop
# (only when integrations/ changed), and can also be invoked by other
# workflows (see release.yml) via workflow_call.
name: Integration

on:
  push:
    branches: [main, develop]
    paths: ["integrations/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: integrations/go.mod

      - name: Start databases
        run: docker compose up -d --wait

      - name: Test
        run: go test ./...

      # Always tear down, even if the tests above failed, so the runner
      # doesn't leak containers.
      - name: Stop databases
        if: always()
        run: docker compose down
