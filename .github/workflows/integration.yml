# E2E tests against real PostgreSQL/MariaDB, run via the integrations/
# submodule's own docker-compose setup. Runs directly on push to main/develop
# (only when integrations/ changed), and can also be invoked by other
# workflows (see release.yml) via workflow_call.
name: Integration

on:
  push:
    branches: [main, develop]
    paths: ["integrations/**"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integrations
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: integrations/go.mod

      - name: Start databases
        run: docker compose up -d --wait

      - name: Test
        run: go test ./...

      # Always tear down, even if the tests above failed, so the runner
      # doesn't leak containers.
      - name: Stop databases
        if: always()
        run: docker compose down
